<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emergency Contact</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500&display=swap" rel="stylesheet" />
  <link href="style.css" rel="stylesheet" />
</head>
<body>
  <form class="card" novalidate>
    <span class="step">Step 2 of 3</span>
    <h1>Emergency contact</h1>
    <p class="hint">We'll flag this person if fatigue stays critical for 10 seconds.</p>
    <div class="row">
      <input id="firstName" placeholder="First name" required />
      <input id="lastName" placeholder="Last name" />
    </div>
    <input id="phone" type="tel" placeholder="Their phone number" required />
    <div class="actions">
      <a class="button secondary" href="login.html">Back</a>
      <button type="submit">Continue</button>
    </div>
  </form>
  <script src="api.js"></script>
  <script>
    if (!loadDraft('driver')) location.replace('login.html');
    bindPersonForm('contact', 'start.html');
  </script>
</body>
</html>
