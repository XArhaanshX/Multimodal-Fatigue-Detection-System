<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500&display=swap" rel="stylesheet" />
  <link href="style.css" rel="stylesheet" />
</head>
<body>
  <form class="card" novalidate>
    <span class="step">Step 1 of 3</span>
    <h1>Create an account</h1>
    <div class="row">
      <input id="firstName" placeholder="First name" autocomplete="given-name" required />
      <input id="lastName" placeholder="Last name" autocomplete="family-name" />
    </div>
    <input id="phone" type="tel" placeholder="Your phone number" autocomplete="tel" required />
    <div class="actions"><button type="submit">Continue</button></div>
  </form>
  <script src="api.js"></script>
  <script>bindPersonForm('driver', 'contact.html');</script>
</body>
</html>
